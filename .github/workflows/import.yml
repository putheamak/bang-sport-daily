name: Import my articles

on:
  workflow_dispatch:
  push:
    paths: ["inbox/**"]     # runs automatically when you add an article to inbox/

permissions:
  contents: write

concurrency:
  group: sportnews
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Import articles from inbox/
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT: ${{ secrets.TELEGRAM_REVIEW_CHAT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m sportnews inbox
      - run: |
          git config user.name  "sportnews-bot"
          git config user.email "sportnews-bot@users.noreply.github.com"
          mkdir -p data output && touch data/.gitkeep output/.gitkeep
          git add data docs output
          git diff --cached --quiet || git commit -m "Import editor's articles"
          git push
