name: Reel photos (free photos to choose from)

on:
  workflow_dispatch:
    inputs:
      id:
        description: "Story ID"
        required: true
      titles:
        description: "Wikipedia article title(s), separated by |"
        required: true

permissions:
  contents: write

concurrency:
  group: reel-photos
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Save free photos with their licences (nothing is published)
        env:
          ID: ${{ inputs.id }}
          TITLES: ${{ inputs.titles }}
        run: python -m sportnews reelphotos "$ID" "$TITLES"
      - name: Keep them on their own branch (not on main)
        run: |
          git config user.name  "sportnews-bot"
          git config user.email "sportnews-bot@users.noreply.github.com"
          git checkout -q --orphan "reel-photos-${{ github.run_id }}"
          git rm -rq --cached . 
          git add -f output/voice/photos
          git commit -qm "Reel photos: $ID"
          git push -q origin "reel-photos-${{ github.run_id }}"
        env:
          ID: ${{ inputs.id }}
