name: Telegram replies

# Every hour: reads your replies to the bot (write 1 3 / publish <ID> / reject <ID> / help) and starts the
# matching workflow. No AI is used; only messages from your own review chat are obeyed.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: trending
  cancel-in-progress: false

jobs:
  replies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Read replies
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT: ${{ secrets.TELEGRAM_REVIEW_CHAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m sportnews replies
      - name: Save
        run: |
          git config user.name  "sportnews-bot"
          git config user.email "sportnews-bot@users.noreply.github.com"
          git add data/trending.json data/last_replies.log
          git diff --cached --quiet || git commit -m "Telegram replies"
          git pull --rebase --autostash || true
          git push
