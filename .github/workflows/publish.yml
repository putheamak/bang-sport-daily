name: Publish / reject stories

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Article ID(s) from the Telegram/email draft, comma-separated — or 'today' / 'all-drafts'"
        required: true
      action:
        description: "What to do"
        type: choice
        options: [publish, reject, publish-anyway]
        default: publish

permissions:
  contents: write

concurrency:
  group: sportnews
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Video tools for Reels (ffmpeg, Chinese font)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk >/dev/null
      - name: ${{ inputs.action }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_EN: ${{ secrets.TELEGRAM_CHANNEL_EN }}
          TELEGRAM_CHANNEL_ZH: ${{ secrets.TELEGRAM_CHANNEL_ZH }}
          TELEGRAM_CHANNEL_RU: ${{ secrets.TELEGRAM_CHANNEL_RU }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          DEFER_FACEBOOK: "1"
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          SITE_URL: ${{ vars.SITE_URL }}
          IDS: ${{ inputs.ids }}
        run: python -m sportnews ${{ inputs.action }} "$IDS"
      - name: Keep the Reel videos 14 days (Actions › this run › Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reels
          path: output/reels/*.mp4
          if-no-files-found: ignore
          retention-days: 14
      - name: Save status
        run: |
          git config user.name  "sportnews-bot"
          git config user.email "sportnews-bot@users.noreply.github.com"
          mkdir -p data && touch data/.gitkeep
          git add data docs
          git diff --cached --quiet || git commit -m "${{ inputs.action }}: ${{ inputs.ids }}"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && break
            sleep 10
          done
      - name: Facebook post + Reel, once the new pages are live (Facebook freezes the link preview at posting time)
        if: inputs.action != 'reject'
        continue-on-error: true
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          IDS: ${{ inputs.ids }}
        run: |
          [ -n "$FB_PAGE_TOKEN" ] || exit 0
          python -c "import yaml,sys; sys.exit(0 if yaml.safe_load(open('config.yaml'))['publish'].get('facebook') else 1)" || { echo "Automatic Facebook posting is paused (publish.facebook: false)"; exit 0; }
          git pull --rebase --autostash
          python -m sportnews facebook --mode post+reel $IDS
          git add data
          git diff --cached --quiet || git commit -m "Facebook: ${{ inputs.ids }}"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && break
            sleep 10
          done
