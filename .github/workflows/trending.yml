name: Trending radar

# Every 4 hours: finds the sport stories many outlets are covering (no AI), sends the top 5 to your
# Telegram review chat, and starts "Write trending stories" when you reply "write 1 3".
on:
  schedule:
    - cron: "41 1-17/4 * * *"     # 08:41, 12:41, 16:41, 20:41, 00:41 Cambodia time
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: trending
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT: ${{ secrets.TELEGRAM_REVIEW_CHAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m sportnews trending
      - name: Save
        run: |
          git config user.name  "sportnews-bot"
          git config user.email "sportnews-bot@users.noreply.github.com"
          git add data/trending.json data/trending.md data/last_trending.log
          git diff --cached --quiet || git commit -m "Trending radar"
          git pull --rebase --autostash || true
          git push
