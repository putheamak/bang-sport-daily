name: Rebuild website

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sportnews
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m sportnews site
      - run: |
          git config user.name  "sportnews-bot"
          git config user.email "sportnews-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Rebuild website"
          git push
