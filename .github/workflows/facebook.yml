name: Facebook check

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Optional: published story IDs to post to the Facebook Page (comma-separated). Empty = only test the token."
        default: ""
        required: false
      mode:
        description: "What to post for those stories"
        type: choice
        options: ["post+reel", "reel", "post", "redo-reel", "rescrape", "redo-post", "cancel"]
        default: "post+reel"

permissions:
  contents: write

concurrency:
  group: sportnews
  cancel-in-progress: false

jobs:
  facebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Video tools for Reels (ffmpeg, Chinese font)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk >/dev/null
      - name: Test token / post
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          IDS: ${{ inputs.ids }}
          MODE: ${{ inputs.mode || 'post+reel' }}
        run: python -m sportnews facebook --mode "$MODE" $IDS
      - name: Keep the Reel videos 14 days (Actions › this run › Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reels
          path: output/reels/*.mp4
          if-no-files-found: ignore
          retention-days: 14
      - run: |
          git config user.name  "sportnews-bot"
          git config user.email "sportnews-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Posted to Facebook"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && break
            sleep 10
          done
