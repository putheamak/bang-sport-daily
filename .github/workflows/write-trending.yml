name: Write trending stories

# Writes the chosen talking points as short explainers (drafts for review).
# Started automatically when you reply "write 1 3" in Telegram, or by hand here.
on:
  workflow_dispatch:
    inputs:
      numbers:
        description: "Numbers from the last Talking points list, e.g. 1 3"
        required: true

permissions:
  contents: write

concurrency:
  group: sportnews
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Write explainers
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT: ${{ secrets.TELEGRAM_REVIEW_CHAT }}
          SITE_URL: ${{ vars.SITE_URL }}
          NUMBERS: ${{ inputs.numbers }}
        run: python -m sportnews write-trending "$NUMBERS"
      - name: Save drafts
        run: |
          git config user.name  "sportnews-bot"
          git config user.email "sportnews-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Trending explainers: ${{ inputs.numbers }}"
          git pull --rebase --autostash || true
          git push
