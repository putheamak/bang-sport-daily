<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review Drafts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --panel:#ffffff; --ink:#1c1b19; --muted:#6b675f; --line:#e3ded3;
  --accent:#0b3c8c; --accent-ink:#ffffff; --red:#c8102e; --chip:#ece7dc;
  --news:#0b3c8c; --history:#8a5a00; --athlete_story:#a3122a;
  --ok:#1f7a3d; --draft:#8a6d00;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121417; --panel:#1b1e23; --ink:#ecebe7; --muted:#9a978f; --line:#2c3037;
    --accent:#6f9bff; --accent-ink:#0d1117; --red:#ff6b7f; --chip:#262a31;
    --news:#86a9ff; --history:#e2b155; --athlete_story:#ff8a9b; --ok:#5fd08a; --draft:#e2c255;
  }
}
:root[data-theme="dark"]{
  --bg:#121417; --panel:#1b1e23; --ink:#ecebe7; --muted:#9a978f; --line:#2c3037;
  --accent:#6f9bff; --accent-ink:#0d1117; --red:#ff6b7f; --chip:#262a31;
  --news:#86a9ff; --history:#e2b155; --athlete_story:#ff8a9b; --ok:#5fd08a; --draft:#e2c255;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
header{border-bottom:3px double var(--line);background:var(--panel)}
.top{max-width:1200px;margin:auto;padding:18px 16px 10px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.top h1{margin:0;font:700 26px/1.2 system-ui,sans-serif;letter-spacing:.2px}
.top h1 small{display:block;font:400 13px "Source Serif 4",serif;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
.top .sp{flex:1}
.bar{max-width:1200px;margin:auto;padding:0 16px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,button,.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--chip);color:var(--ink);
  border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{max-width:1200px;margin:auto;padding:16px;display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:18px}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;border-left:4px solid var(--c)}
.card[aria-current="true"]{outline:2px solid var(--accent)}
.card h3{margin:4px 0 2px;font:600 16px/1.45 system-ui,sans-serif}
.card p{margin:0;color:var(--muted);font-size:13px;font-family:"Source Serif 4",serif}
.meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.type{color:var(--c);font-weight:700;font-size:12px}
.status{border-radius:4px;padding:0 6px;font-size:11px;border:1px solid currentColor}
.status.draft{color:var(--draft)} .status.published{color:var(--ok)} .status.rejected{color:var(--red)}
.reader{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px clamp(16px,4vw,44px);min-height:60vh}
.reader .kicker{border-left:4px solid var(--c);padding-left:10px}
.reader h2{font:700 clamp(22px,3vw,30px)/1.4 system-ui,sans-serif;margin:10px 0 6px}
.reader .sub{color:var(--muted);font-style:italic;margin:0 0 18px;font-family:"Source Serif 4",serif}
.body{font:17px/1.85 "PT Serif",Georgia,"PingFang SC",serif;max-width:68ch}
.body[lang="en"]{font-family:"Source Serif 4",serif;line-height:1.7}
.body h3{font:600 19px system-ui,sans-serif;margin:26px 0 6px}
.lang-sep{border:0;border-top:1px dashed var(--line);margin:34px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.actions a,.actions button{text-decoration:none;font-size:13px;border-radius:8px;padding:6px 12px;border:1px solid var(--line);background:var(--chip);color:var(--ink)}
.actions .primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.box{border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-top:18px;font-size:14px}
.box.warn{border-color:var(--draft)}
.box h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.box ul{margin:0;padding-left:18px} .box a{color:var(--accent);word-break:break-word}
.social{white-space:pre-wrap;background:var(--chip);border-radius:8px;padding:10px 12px;font-size:14px}
.empty{color:var(--muted);text-align:center;padding:60px 10px}
.back{display:none}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:.2s}
.toast.on{opacity:1}
@media (max-width:820px){
  main{grid-template-columns:1fr}
  body.reading .list{display:none}
  body:not(.reading) .reader{display:none}
  .back{display:inline-block;margin-bottom:10px}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1 id="title">Review<small>Newsroom</small></h1>
    <span class="sp"></span>
    <a id="memoLink" class="chip" target="_blank" rel="noopener" style="text-decoration:none">✎ Write today's memo</a>
    <button id="theme" title="Toggle theme">◐</button>
  </div>
  <div class="bar" role="toolbar">
    <select id="date" aria-label="Date"></select>
    <span class="chip" data-f="type" data-v="all" aria-pressed="true">All</span>
    <span class="chip" data-f="type" data-v="news" aria-pressed="false">News</span>
    <span class="chip" data-f="type" data-v="history" aria-pressed="false">On this day</span>
    <span class="chip" data-f="type" data-v="athlete_story" aria-pressed="false">Athletes</span>
    <span style="width:10px"></span>
    <span class="chip" data-f="lang" data-v="en" aria-pressed="true">EN</span>
    <span class="chip" data-f="lang" data-v="zh" aria-pressed="false">中文</span>
    <span class="chip" data-f="lang" data-v="ru" aria-pressed="false">RU</span>
    <span class="chip" data-f="lang" data-v="all" aria-pressed="false">All</span>
  </div>
</header>
<main>
  <section class="list" id="list" aria-label="Stories"></section>
  <article class="reader" id="reader"><div class="empty">Select a story</div></article>
</main>
<div class="toast" id="toast"></div>
<script>
const LABEL={news:["News"],history:["On this day"],athlete_story:["Athlete story"]};
const S={type:"all",lang:"en",date:"all",data:null};
try{const p=JSON.parse(localStorage.getItem("ksd")||"{}");Object.assign(S,{lang:p.lang||"en"});if(p.theme)document.documentElement.dataset.theme=p.theme}catch(e){}
const save=()=>{try{localStorage.setItem("ksd",JSON.stringify({lang:S.lang,theme:document.documentElement.dataset.theme||""}))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function md(t){
  return esc(t).split(/\n\s*\n/).map(b=>{
    b=b.trim(); if(!b) return "";
    if(b.startsWith("## ")||b.startsWith("### ")) return `<h3>${b.replace(/^#+\s*/,"")}</h3>`;
    if(/^[-*] /.test(b)) return "<ul>"+b.split(/\n/).map(l=>`<li>${inline(l.replace(/^[-*]\s*/,""))}</li>`).join("")+"</ul>";
    if(b.startsWith("&gt; ")) return `<blockquote>${inline(b.replace(/^&gt;\s*/gm,""))}</blockquote>`;
    return `<p>${inline(b).replace(/\n/g,"<br>")}</p>`;
  }).join("");
}
function inline(s){return s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>")
  .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1600)}
async function copy(txt,m){try{await navigator.clipboard.writeText(txt);toast(m||"Copied")}catch(e){prompt("Copy:",txt)}}

function filtered(){return S.data.articles.filter(a=>(S.type==="all"||a.type===S.type)&&(S.date==="all"||a.date===S.date))}
function head(a){const L=a[S.lang==="all"?"en":S.lang];return (L&&L.headline)||(a.en||{}).headline||a.id}
function renderList(){
  const items=filtered(), cur=location.hash.slice(2);
  $("#list").innerHTML=items.length?items.map(a=>`
    <div class="card" style="--c:var(--${a.type})" data-id="${a.id}" aria-current="${a.id===cur}" tabindex="0">
      <div class="meta"><span class="type">${LABEL[a.type]?.[0]||a.type}</span><span>${a.date}</span>
      <span class="status ${a.status}">${a.status}</span></div>
      <h3>${esc(head(a))}</h3>
      <p>${["en","zh","ru"].filter(l=>a[l]).map(l=>l.toUpperCase()).join(" · ")}</p>
    </div>`).join(""):`<div class="empty">No stories yet. The first daily run will fill this page.</div>`;
  document.querySelectorAll(".card").forEach(c=>{c.onclick=c.onkeydown=e=>{if(e.type==="keydown"&&e.key!=="Enter")return;location.hash="#/"+c.dataset.id}});
}
function langBlock(a,l){const L=a[l];if(!L||!L.headline)return"";
  return `<div lang="${l}"><h2>${esc(L.headline)}</h2>${L.subheadline?`<p class="sub">${esc(L.subheadline)}</p>`:""}
   <div class="body" lang="${l}">${md(L.body_markdown||"")}</div>
   <div class="box"><h4>Social post · ${l.toUpperCase()}</h4><div class="social">${esc(L.social_post||"")}</div>
   <div class="actions"><button data-copy="${l}">Copy post</button><button data-copyall="${l}">Copy full article</button></div></div></div>`}
function renderReader(){
  const id=location.hash.slice(2), a=S.data.articles.find(x=>x.id===id);
  document.body.classList.toggle("reading",!!a);
  if(!a){$("#reader").innerHTML='<div class="empty">Select a story</div>';return}
  const langs=S.lang==="all"?["en","zh","ru"]:[S.lang];
  const pub=S.data.publish_workflow;
  $("#reader").innerHTML=`<button class="back" onclick="location.hash=''">← Back</button>
   <div class="kicker" style="--c:var(--${a.type})"><div class="meta"><span class="type">${LABEL[a.type]?.join(" · ")||a.type}</span>
   <span>${a.date}</span><span class="status ${a.status}">${a.status}</span><span>model: ${esc(a.model)}</span></div></div>
   <div class="actions">
     ${a.status!=="published"&&pub?`<a class="primary" href="${pub}" target="_blank" rel="noopener" data-pubid="${a.id}">Approve & publish →</a>`:""}
     <button data-copyid="${a.id}">Copy ID</button>
     ${a.published_to?.length?`<span class="meta">Published: ${a.published_to.map(p=>p.channel).join(", ")}</span>`:""}
   </div>
   ${a.facts_to_verify?.length?`<div class="box warn"><h4>Check before publishing</h4><ul>${a.facts_to_verify.map(f=>`<li>${esc(f)}</li>`).join("")}</ul></div>`:""}
   ${langs.map(l=>langBlock(a,l)).join('<hr class="lang-sep">')}
   ${a.sources?.length?`<div class="box"><h4>Sources · ប្រភព</h4><ul>${a.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`).join("")}</ul></div>`:""}`;
  $("#reader").querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>copy(a[b.dataset.copy].social_post,"Post copied"));
  $("#reader").querySelectorAll("[data-copyall]").forEach(b=>b.onclick=()=>{const L=a[b.dataset.copyall];copy(`${L.headline}\n\n${L.body_markdown}`,"Article copied")});
  $("#reader").querySelectorAll("[data-copyid]").forEach(b=>b.onclick=()=>copy(b.dataset.copyid,"ID copied"));
  $("#reader").querySelectorAll("[data-pubid]").forEach(b=>b.addEventListener("click",()=>copy(b.dataset.pubid,"ID copied — paste it in “Run workflow”")));
  window.scrollTo({top:0});
}
function syncChips(){document.querySelectorAll(".chip[data-f]").forEach(c=>c.setAttribute("aria-pressed",S[c.dataset.f]===c.dataset.v))}
document.querySelectorAll(".chip[data-f]").forEach(c=>c.onclick=()=>{S[c.dataset.f]=c.dataset.v;save();syncChips();renderList();renderReader()});
$("#date").onchange=e=>{S.date=e.target.value;renderList()};
$("#theme").onclick=()=>{const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;d.dataset.theme=dark?"light":"dark";save()};
window.onhashchange=()=>{renderList();renderReader()};
fetch("articles.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{
  S.data=d; const site=d.site||{};
  $("#title").innerHTML=`${esc(site.name||"")}<small>Drafts review</small>`;
  $("#memoLink").href=d.repo?`https://github.com/${d.repo}/new/main/memos?filename=${new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Phnom_Penh"})}.md`:"#";
  const dates=[...new Set(d.articles.map(a=>a.date))];
  $("#date").innerHTML=`<option value="all">All dates</option>`+dates.map(x=>`<option>${x}</option>`).join("");
  syncChips();renderList();renderReader();
}).catch(()=>{$("#list").innerHTML='<div class="empty">Could not load articles.json</div>'});
</script>
</body>
</html>
