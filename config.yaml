# ===========================================================
#  Bang Sport Daily — main configuration
# ===========================================================

site:
  name: "Bang Sport Daily"
  name_zh: "棒体育日报"          # 棒 (bàng) = "awesome" — sounds like Bang
  name_ru: "Bang Sport Daily"   # Latin brand name is common in Russian media; or "Бэнг Спорт"
  tagline_en: "World sport, told with a human voice"
  tagline_zh: "用有温度的文字讲述世界体育"
  tagline_ru: "Мировой спорт с человеческим голосом"
  author: "Mak"                 # the real person who reviews and approves every story
  # ---- Compliance (Google Search, AdSense, privacy laws) — see README "Compliance" ----
  # bylines: "author"    = "By Mak" on every story (RECOMMENDED: real, accountable author)
  #          "desk"      = "Bang Football Desk · edited by Mak" (no invented people)
  #          "pen_names" = invented columnist names — NOT recommended: since Oct 2026 Google calls
  #                        made-up author names "deceptive authorship" (hurts ranking and ad approval)
  bylines: "author"
  author_bio_en: "Mak is the founder and editor of Bang Sport Daily. Based in Phnom Penh, Cambodia, he has followed world sport for years and reviews every story before it is published."
  author_bio_zh: "Mak 是棒体育日报的创办人兼主编，常驻柬埔寨金边，多年关注世界体育，每篇文章发布前均由他审核。"
  author_bio_ru: "Mak — основатель и редактор Bang Sport Daily. Живёт в Пномпене (Камбоджа), много лет следит за мировым спортом и проверяет каждый материал перед публикацией."
  contact_email: "bangsportdaily@gmail.com"             # a dedicated address readers can write to (required for AdSense). e.g. "hello@yourdomain.com"
  custom_domain: ""             # e.g. "bangsportdaily.com" — needed for AdSense; writes docs/CNAME
  adsense_client: ""            # e.g. "ca-pub-1234567890123456" — only after AdSense approval; adds ads.txt
  wire_box: true                # "Around the world" headlines from other outlets. Turn OFF before monetizing
                                #   (some RSS feeds, e.g. BBC, allow non-commercial use only)
  timezone: "Asia/Phnom_Penh"
  # Your GitHub Pages address (used for links, sitemap, RSS). On GitHub Actions it is detected
  # automatically from the repo name, so it still works if you name the repo differently.
  url: "https://putheamak.github.io/bang-sport-daily"
  # Your public Telegram channels (shown as "Follow us" buttons). Leave empty until they exist.
  telegram_en: "bangsportdaily"        # e.g. "bangsportdaily"  (without @)
  telegram_zh: "bangsportdaily_zh"
  telegram_ru: "bangsportdaily_ru"

# ---------- Writing ----------
writing:
  style: journalist        # journalist = third-person sports journalism (recommended)
                           # personal   = first-person column, only with real memos from you

# ---------- Languages ----------
# English is written first (in your voice); then adapted — not word-for-word translated — to the others.
languages:
  master: en
  others: [zh, ru]
  chinese_script: simplified     # simplified (Mainland/SEA/Malaysia/Singapore) | traditional (Taiwan/HK)

# ---------- AI ----------
ai:
  provider: gemini        # gemini = FREE tier (Google AI Studio key) | claude = paid, best quality
  gemini:
    model: auto           # "auto" picks the newest stable Flash model your key can use
    fallback_model: auto-lite   # used automatically when the main model hits the free quota (429)
    google_search: true   # grounding with Google Search (free quota on Flash; verify in AI Studio)
    pause_seconds: 8      # wait between calls so we stay under free-tier per-minute limits
  claude:
    model: "claude-sonnet-5-5"
    web_search_max_uses: 4
  max_output_tokens: 12000

# ---------- What to produce each day ----------
daily_plan:
  news: 2            # best sport stories of the last 24-36h (regionally balanced)
  history: 1         # "On this day in sport" (from Wikipedia's dated list, never from AI memory)
  athlete_story: 1   # life story of a legendary / rising athlete (rotates athletes.yaml, from Wikipedia)
  alternate_features: true   # 3 stories a day: 2 news + history OR life story (alternating days)
  max_per_sport: 1   # variety: no more than N news stories from the same sport per day

# Sports the system watches. weight > 1 = more likely to be chosen; 0 = ignore that sport.
sports:
  football:   {weight: 1.5, keywords: ["football", "soccer", "premier league", "champions league", "la liga", "serie a", "bundesliga", "fifa", "uefa", "world cup", "足球", "中超", "футбол", "рпл"]}
  basketball: {weight: 1.3, keywords: ["nba", "basketball", "euroleague", "篮球", "cba", "баскетбол"]}
  tennis:     {weight: 1.0, keywords: ["tennis", "atp", "wta", "wimbledon", "us open", "roland garros", "australian open", "网球", "теннис"]}
  combat:     {weight: 1.0, keywords: ["ufc", "mma", "boxing", "bout", "knockout", "拳击", "综合格斗", "бокс", "ммa", "мма"]}
  motorsport: {weight: 0.8, keywords: ["formula 1", "f1", "grand prix", "motogp", "一级方程式", "формула-1", "формула 1"]}
  olympic:    {weight: 1.0, keywords: ["olympic", "athletics", "swimming", "gymnastics", "figure skating", "table tennis", "badminton", "volleyball", "奥运", "乒乓", "羽毛球", "排球", "олимп", "фигурн", "хоккей"]}
  hockey:     {weight: 0.8, keywords: ["nhl", "khl", "ice hockey", "冰球", "кхл", "нхл"]}
  cricket:    {weight: 0.5, keywords: ["cricket", "ipl", "test match"]}

# Extra score for the biggest events
boost: ["world cup", "champions league final", "olympics", "nba finals", "grand slam", "wimbledon", "super bowl",
        "ballon d'or", "record", "world record", "世界杯", "奥运", "чемпионат мира", "олимпиад"]
block: ["betting tips", "odds", "casino", "fantasy picks", "live stream free", "прогноз на матч", "ставки", "博彩",
        # gossip and non-sport (not news for this site)
        "net worth", "how rich", "girlfriend", "boyfriend", "is dating", "are dating", "divorce", "pregnant", "taylor swift",
        "find husband", "find a wife", "tourism", "travel route", "旅游", "消费季", "绯闻", "恋情", "роман с", "развод",
        # previews / "where to watch" items (no result yet, nothing to report)
        "how to watch", "where to watch", "live stream", "start time", "kick-off time", "prediction", "preview:",
        "во сколько начало", "где смотреть", "онлайн-трансляция", "прямая трансляция", "прогноз", "直播", "前瞻"]

# ---------- Publishing ----------
publish:
  auto_publish: false      # false = drafts go to your private Telegram review chat + email; you approve
  website: true            # public reader site on GitHub Pages (published stories only)
  telegram: true           # one channel per language: TELEGRAM_CHANNEL_EN / _ZH / _RU
  facebook: false          # optional: FB_PAGE_ID + FB_PAGE_TOKEN (posts the English version)
  email_digest: true
  markdown: true
  docx: true
  photos: true             # free-licence photos from Wikimedia Commons, with credits
  drafts_on_site: false    # true = adds docs/review.html with drafts (visible to anyone who finds it!)

# ---------- Editorial standards (ethics, professionalism, up-to-date sources) ----------
# Every draft is checked automatically; problems appear in the review message.
# BLOCK problems stop publishing (choose "publish-anyway" in the Publish workflow to override).
# A weekly audit re-checks all published stories and their source links -> data/audit.md
standards:
  enabled: true
  block_on_publish: true
  min_sources_news: 2           # at least one must be a major or official outlet
  max_source_age_days_news: 3   # newest source should be this close to the story date
  max_story_age_days_news: 4    # older news drafts: update or reject
  min_words: {news: 250, history: 400, athlete_story: 500}
  max_headline_chars: 110
  check_links: true
  auto_reject: true             # AI drafts that fail (BLOCK, too short, too few sources) never reach your review

# ---------- Regional balance (share of all stories over the last 7 days) ----------
# Each day the system writes from the region furthest behind its target, but only when that region has a
# good story. Quality first: a weak story is never chosen just to fill a quota.
regions:
  global: 45       # Western, Asia and the rest of the world
  china: 15
  russia: 15
  sea: 15          # Southeast Asia (Thailand, Vietnam, Indonesia, Malaysia, Philippines, Singapore, ...)
  cambodia: 10     # Cambodian clubs, athletes and events, often in an Asian / ASEAN context
  window_days: 7

# ---------- News sources (free RSS) ----------
# These feeds are used as SOURCES OF FACTS only. The AI writes original stories and credits them.
# A feed that fails is skipped and logged — never fatal. Add or remove freely.
feeds:
  - {name: "BBC Sport",        url: "https://feeds.bbci.co.uk/sport/rss.xml", lang: en}
  - {name: "The Guardian Sport", url: "https://www.theguardian.com/sport/rss", lang: en}
  - {name: "ESPN",             url: "https://www.espn.com/espn/rss/news", lang: en}
  - {name: "Sky Sports",       url: "https://www.skysports.com/rss/12040", lang: en}
  - {name: "Google News – Sports (EN)", url: "https://news.google.com/rss/headlines/section/topic/SPORTS?hl=en-US&gl=US&ceid=US:en", lang: en}
  - {name: "Google News – 体育 (ZH)",   url: "https://news.google.com/rss/headlines/section/topic/SPORTS?hl=zh-CN&gl=CN&ceid=CN:zh-Hans", lang: zh}
  - {name: "Google News – Спорт (RU)",  url: "https://news.google.com/rss/headlines/section/topic/SPORTS?hl=ru&gl=RU&ceid=RU:ru", lang: ru}
  - {name: "Championat",       url: "https://www.championat.com/rss/news/", lang: ru}
  - {name: "Sports.ru",        url: "https://www.sports.ru/rss/all_news.xml", lang: ru}
  - {name: "Спорт-Экспресс",   url: "https://www.sport-express.ru/services/materials/news/se/", lang: ru}
  - {name: "РИА Новости Спорт", url: "https://ria.ru/export/sport/rss2/index.xml", lang: ru}
  - {name: "中国新闻网 体育",   url: "https://www.chinanews.com.cn/rss/sports.xml", lang: zh}
  - {name: "Google News – Cambodia sport", url: "https://news.google.com/rss/search?q=(Cambodia+OR+Cambodian+OR+%22Phnom+Penh+Crown%22+OR+%22Svay+Rieng%22+OR+%22Boeung+Ket%22+OR+%22Visakha+FC%22)+(football+OR+sport+OR+%22SEA+Games%22+OR+boxing+OR+%22Kun+Khmer%22)+when:3d&hl=en-US&gl=US&ceid=US:en", lang: en}
  - {name: "Google News – Southeast Asia sport", url: "https://news.google.com/rss/search?q=(%22ASEAN+Championship%22+OR+%22SEA+Games%22+OR+Thailand+OR+Vietnam+OR+Indonesia+OR+Malaysia+OR+Philippines+OR+Singapore)+(football+OR+badminton+OR+boxing+OR+%22national+team%22)+when:2d&hl=en-US&gl=US&ceid=US:en", lang: en}

# ---------- Bylines: disclosed pen-name columnists ----------
# Each story is signed by the columnist for its sport. These are PEN NAMES, not real people:
# every article shows "Pen name · AI-assisted · edited by <author>" and links to the About page.
# Rename them freely (keep names that don't belong to real, well-known people).
columnists:
  football:      {en: "Leo Hartwell",   zh: "利奥·哈特维尔",   ru: "Лео Хартвелл",    beat_en: "Football",      beat_zh: "足球",       beat_ru: "Футбол"}
  basketball:    {en: "Marcus Delane",  zh: "马库斯·德莱恩",   ru: "Маркус Делейн",   beat_en: "Basketball",    beat_zh: "篮球",       beat_ru: "Баскетбол"}
  tennis:        {en: "Clara Voss",     zh: "克拉拉·沃斯",     ru: "Клара Восс",      beat_en: "Tennis",        beat_zh: "网球",       beat_ru: "Теннис"}
  combat:        {en: "Viktor Ardan",   zh: "维克多·阿尔丹",   ru: "Виктор Ардан",    beat_en: "Combat sports", beat_zh: "格斗",       beat_ru: "Единоборства"}
  motorsport:    {en: "Rory Kettering", zh: "罗里·凯特林",     ru: "Рори Кеттеринг",  beat_en: "Motorsport",    beat_zh: "赛车",       beat_ru: "Автоспорт"}
  olympic:       {en: "Lan Meiyu",      zh: "兰美玉",          ru: "Лань Мэйюй",      beat_en: "Olympic sports", beat_zh: "奥运项目",  beat_ru: "Олимпийские виды"}
  hockey:        {en: "Anya Sorel",     zh: "安雅·索雷尔",     ru: "Аня Сорель",      beat_en: "Ice hockey",    beat_zh: "冰球",       beat_ru: "Хоккей"}
  cricket:       {en: "Arun Devaraj",   zh: "阿伦·德瓦拉杰",   ru: "Арун Деварадж",   beat_en: "Cricket",       beat_zh: "板球",       beat_ru: "Крикет"}
  history:       {en: "Ivo Marlow",     zh: "伊沃·马洛",       ru: "Иво Марлоу",      beat_en: "Sport history", beat_zh: "体育历史",   beat_ru: "История спорта"}
  athlete_story: {en: "Nadia Rennick",  zh: "娜迪娅·雷尼克",   ru: "Надя Реннек",     beat_en: "Athlete stories", beat_zh: "人物故事", beat_ru: "Истории спортсменов"}
  default:       {en: "Bang Sport Desk", zh: "棒体育编辑部",   ru: "Редакция Bang Sport", beat_en: "World sport", beat_zh: "世界体育", beat_ru: "Мировой спорт"}
